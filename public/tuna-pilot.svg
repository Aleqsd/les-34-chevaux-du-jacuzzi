<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="tuna-title tuna-desc">
  <title id="tuna-title">Pilote Thon</title>
  <desc id="tuna-desc">Boîte de thon ronde bleu océan, couvercle métallique argenté, tirette et poisson cyan.</desc>
  <defs>
    <linearGradient id="tuna-wall" x1="19" y1="95" x2="144" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#053551"/>
      <stop offset=".22" stop-color="#1178A4"/>
      <stop offset=".46" stop-color="#075780"/>
      <stop offset=".8" stop-color="#032942"/>
      <stop offset="1" stop-color="#0C5373"/>
    </linearGradient>
    <linearGradient id="tuna-rim" x1="34" y1="22" x2="116" y2="127" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".21" stop-color="#C8EAF4"/>
      <stop offset=".43" stop-color="#7499B0"/>
      <stop offset=".6" stop-color="#EAF9FF"/>
      <stop offset=".83" stop-color="#6E8DA3"/>
      <stop offset="1" stop-color="#C2DAE8"/>
    </linearGradient>
    <radialGradient id="tuna-lid" cx="0" cy="0" r="1" gradientTransform="translate(54 45) rotate(54) scale(93 104)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1599C7"/>
      <stop offset=".5" stop-color="#075786"/>
      <stop offset="1" stop-color="#032A4B"/>
    </radialGradient>
    <linearGradient id="tuna-fish" x1="53" y1="69" x2="105" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFEFF"/>
      <stop offset=".6" stop-color="#83F3F2"/>
      <stop offset="1" stop-color="#3ECBE4"/>
    </linearGradient>
    <linearGradient id="tuna-tab" x1="71" y1="31" x2="91" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#C0D9E7"/>
      <stop offset=".72" stop-color="#7F9CAC"/>
      <stop offset="1" stop-color="#E6F8FF"/>
    </linearGradient>
  </defs>
  <!-- The lower cylindrical wall gives the circular lid a shallow perspective. -->
  <path d="M18 76C18 45 45 22 80 22S142 45 142 76V91C142 122 115 143 80 143S18 122 18 91V76Z" fill="url(#tuna-wall)" stroke="#032B47" stroke-width="3"/>
  <path d="M25 106C35 125 57 136 80 136C104 136 128 124 136 106" stroke="#83D5E8" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 116L34 122M46 122L46 129M59 127L59 134M73 130L73 137M87 130L87 137M101 127L101 134M114 121L114 128M126 114L126 121" stroke="#021F37" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Broad silver rim stays legible at 48 pixels. -->
  <ellipse cx="80" cy="75" rx="63" ry="55" fill="url(#tuna-rim)" stroke="#052E49" stroke-width="2.5"/>
  <ellipse cx="80" cy="74" rx="57" ry="49" fill="url(#tuna-lid)" stroke="#143C5B" stroke-width="2"/>
  <ellipse cx="80" cy="74" rx="53" ry="45" stroke="#51BED8" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M31 54C40 36 59 26 80 26C97 26 111 31 122 41" stroke="#FFFFFF" stroke-opacity=".83" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M27 76C27 91 35 104 47 112" stroke="#78E4EE" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <!-- A real pull ring, with a dark opening and a visible rivet. -->
  <g transform="rotate(-10 80 46)">
    <path d="M71 45V37C71 32 75 29 80 29S89 32 89 37V46C89 53 85 59 80 59S71 53 71 45Z" fill="#001E37" fill-opacity=".45" transform="translate(1 2)"/>
    <path d="M71 44V37C71 32 75 29 80 29S89 32 89 37V44C89 51 85 57 80 57S71 51 71 44Z" fill="url(#tuna-tab)" stroke="#63869C" stroke-width="1.5"/>
    <path d="M75.5 38C75.5 35.5 77.5 34 80 34C82.5 34 84.5 35.5 84.5 38V41C84.5 44.5 82.7 46 80 46C77.3 46 75.5 44.5 75.5 41V38Z" fill="#063858" stroke="#F0FCFF" stroke-opacity=".45"/>
    <circle cx="80" cy="52" r="2.7" fill="#6C8DA2" stroke="#EAF9FF" stroke-width="1"/>
  </g>
  <!-- A single bold tuna silhouette, facing right. -->
  <path d="M60 76L45 65L47 90L61 81C70 93 92 95 110 78C92 61 71 62 60 76Z" fill="#001F39" fill-opacity=".5" transform="translate(0 2)"/>
  <path d="M61 75L46 65L48 88L61 80C73 92 94 91 111 77C94 61 72 62 61 75Z" fill="url(#tuna-fish)" stroke="#052F4D" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M77 65L85 57L88 65M77 86L85 93L88 86" fill="#83F3F2" stroke="#052F4D" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M91 68C88 74 88 79 91 85" stroke="#128BAE" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="75" r="2.2" fill="#053450"/>
  <circle cx="100.5" cy="74.4" r=".65" fill="#FFFFFF"/>
  <path d="M64 77H80" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <text x="80" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#E9FCFF">THON</text>
  <path d="M42 101H49M111 101H118" stroke="#57DCE7" stroke-width="2" stroke-linecap="round"/>
</svg>

